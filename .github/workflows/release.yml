name: Release

# Build native binaries for Windows / Linux / macOS.
#  - Push a tag like `v0.2.3`  -> builds all platforms and attaches the archives
#    to a GitHub Release.
#  - Run manually (workflow_dispatch) -> builds all platforms and uploads them as
#    downloadable workflow artifacts (no release created).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create / update the GitHub Release

# Prevent two manually triggered runs for the same ref from publishing at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test release tooling
        run: python -m unittest scripts/test_release_notes.py scripts/test_update_manifest.py

      - name: Validate release documents
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python scripts/release_notes.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/release_notes.py --check-current
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: tiny-shell.exe
          - os: ubuntu-24.04 # FreeRDP 3 development packages are available on Noble.
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            bin: tiny-shell
          - os: macos-14 # Apple Silicon; keep the Sonoma deployment baseline.
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: tiny-shell
          - os: macos-15-intel # Native Intel runner so Homebrew FreeRDP matches the target.
            target: x86_64-apple-darwin
            name: macos-x86_64
            bin: tiny-shell

    steps:
      - uses: actions/checkout@v5

      - name: Validate and export release version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ID="$(cargo pkgid)"
          PACKAGE_FRAGMENT="${PACKAGE_ID##*#}"
          CARGO_VERSION="${PACKAGE_FRAGMENT##*@}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
              echo "release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}" >&2
              exit 1
            fi
          fi
          echo "RELEASE_VERSION=v${CARGO_VERSION}" >> "$GITHUB_ENV"

      # GPUI needs these system libs on Linux to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake curl desktop-file-utils file \
            freerdp3-dev patchelf \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

          echo "TINY_SHELL_FREERDP_INCLUDE_DIRS=/usr/include/freerdp3:/usr/include/winpr3" >> "$GITHUB_ENV"

      - name: Install FreeRDP build dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install freerdp dylibbundler
          FREERDP_PREFIX="$(brew --prefix freerdp)"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "TINY_SHELL_FREERDP_INCLUDE_DIRS=${FREERDP_PREFIX}/include/freerdp3:${FREERDP_PREFIX}/include/winpr3" >> "$GITHUB_ENV"
          echo "TINY_SHELL_FREERDP_LIB_DIR=${FREERDP_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install FreeRDP build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install "freerdp[client]:x64-windows" --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed with exit code $LASTEXITCODE"
          }
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $includeDirs = @(
            (Join-Path $prefix "include\freerdp3"),
            (Join-Path $prefix "include\winpr3")
          ) -join ";"
          "TINY_SHELL_FREERDP_INCLUDE_DIRS=$includeDirs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TINY_SHELL_FREERDP_LIB_DIR=$(Join-Path $prefix 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FREERDP_RUNTIME_DIR=$(Join-Path $prefix 'bin')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Matches CI so a recent release build can warm the tag build.
          shared-key: ${{ matrix.name }}

      - name: Build (release)
        run: cargo build --locked --release --target ${{ matrix.target }} --features freerdp

      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress --yes
          }

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          VERSION="${RELEASE_VERSION}"
          STAGE="tiny-shell-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Note: scripts/package-macos-app.sh now accepts --target and shares
            # the Info.plist template, but we still inline the bundle assembly
            # here so matrix builds keep a single shell step and full control
            # over the staging directory used by ditto/pkgbuild below.

            APP="TinyShell.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources" "$CONTENTS/Frameworks"

            cp "target/${{ matrix.target }}/release/tiny-shell" "$CONTENTS/MacOS/"
            cp "assets/icons/tiny-shell.icns" "$CONTENTS/Resources/tiny-shell.icns"

            VERSION_NUM="${VERSION#v}"
            # Info.plist lives as a template in the repo (assets/macos/Info.plist)
            # with a {{VERSION}} placeholder; substituting here keeps the
            # workflow and the local packaging script in sync from one source.
            sed "s/{{VERSION}}/${VERSION_NUM}/g" \
              "assets/macos/Info.plist" > "$CONTENTS/Info.plist"

            printf 'APPL????' > "$CONTENTS/PkgInfo"

            # Copy every non-system dynamic dependency (including FreeRDP,
            # WinPR and their Homebrew dependencies) into the application and
            # rewrite load commands to resolve from Contents/Frameworks.
            dylibbundler \
              -od -b \
              -x "$CONTENTS/MacOS/tiny-shell" \
              -d "$CONTENTS/Frameworks" \
              -p @executable_path/../Frameworks/

            # Ad-hoc code-sign the assembled bundle.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # ── Portable edition: zip of the signed .app bundle ──────
            # ditto preserves code-signature and bundle metadata.
            ditto -c -k --keepParent "$APP" "${STAGE}-portable.zip"

            # ── Installer edition: .pkg that installs into /Applications
            # pkgbuild wraps the .app in an Apple installer package.
            # No Developer ID Installer cert is available in CI, so the
            # .pkg is unsigned; Gatekeeper will prompt on first launch
            # (same as the ad-hoc signed .app) — users allow it via
            # System Settings > Privacy & Security.
            PKG_STAGING="$(mktemp -d)"
            cp -R "$APP" "$PKG_STAGING/"
            pkgbuild \
              --root "$PKG_STAGING" \
              --identifier "dev.tiny-shell.app" \
              --version "$VERSION_NUM" \
              --install-location "/Applications" \
              "${STAGE}-setup.pkg"
            rm -rf "$PKG_STAGING"

            # upload-artifact accepts multiple newline-separated paths.
            echo "ASSETS<<EOF" >> "$GITHUB_ENV"
            echo "${STAGE}-portable.zip" >> "$GITHUB_ENV"
            echo "${STAGE}-setup.pkg" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            mkdir "$STAGE/lib"
            while read -r soname resolved; do
              if [[ "$soname" == libfreerdp*.so* || "$soname" == libwinpr*.so* ]]; then
                cp -L "$resolved" "$STAGE/lib/$soname"
              fi
            done < <(ldd "$STAGE/${{ matrix.bin }}" | awk '$2 == "=>" && $3 ~ /^\// { print $1, $3 }')
            if ! compgen -G "$STAGE/lib/libfreerdp*.so*" >/dev/null || \
               ! compgen -G "$STAGE/lib/libwinpr*.so*" >/dev/null; then
              echo "FreeRDP runtime libraries were not found in the linked binary" >&2
              exit 1
            fi
            patchelf --set-rpath '$ORIGIN/lib' "$STAGE/${{ matrix.bin }}"
            if LD_LIBRARY_PATH="$PWD/$STAGE/lib" ldd "$STAGE/${{ matrix.bin }}" | grep -q "not found"; then
              echo "Packaged Linux binary has unresolved dynamic libraries" >&2
              LD_LIBRARY_PATH="$PWD/$STAGE/lib" ldd "$STAGE/${{ matrix.bin }}"
              exit 1
            fi
            tar -czf "${STAGE}.tar.gz" "$STAGE"

            bash scripts/package-linux-appimage.sh \
              --version "$VERSION" \
              --target "${{ matrix.target }}" \
              --output-dir . \
              --binary "target/${{ matrix.target }}/release/${{ matrix.bin }}" \
              --skip-build

            APPIMAGE="${STAGE}.AppImage"
            test -x "$APPIMAGE"
            echo "ASSETS<<EOF" >> "$GITHUB_ENV"
            echo "${STAGE}.tar.gz" >> "$GITHUB_ENV"
            echo "$APPIMAGE" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: Package Windows portable and installer editions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          ./scripts/package-windows.ps1 `
            -Version $version `
            -Target "${{ matrix.target }}" `
            -OutputDir "dist" `
            -RuntimeDir $env:FREERDP_RUNTIME_DIR `
            -SkipBuild

          $portable = "dist/tiny-shell-$version-windows-x86_64-portable.zip"
          $installer = "dist/tiny-shell-$version-windows-x86_64-setup.exe"
          "ASSETS<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Append
          $portable | Out-File -FilePath $env:GITHUB_ENV -Append
          $installer | Out-File -FilePath $env:GITHUB_ENV -Append
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSETS }}

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate release notes from version document
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          NOTES_FILE="dist/release-notes.md"
          VERSION_DOC="docs/upgrade/${GITHUB_REF_NAME}/README.md"

          # 优先使用版本详情文档
          if [[ -f "${VERSION_DOC}" ]]; then
            echo "使用版本详情文档: ${VERSION_DOC}"
            python scripts/release_notes.py \
              --tag "${GITHUB_REF_NAME}" \
              --output "${NOTES_FILE}"
          else
            echo "版本详情文档不存在，自动生成 release notes"
            # 获取上一个标签
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [[ -n "${PREV_TAG}" ]]; then
              echo "## 变更" > "${NOTES_FILE}"
              echo "" >> "${NOTES_FILE}"
              git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> "${NOTES_FILE}"
            else
              echo "## 首次发布" > "${NOTES_FILE}"
              echo "" >> "${NOTES_FILE}"
              git log --pretty=format:"- %s" >> "${NOTES_FILE}"
            fi
            echo "" >> "${NOTES_FILE}"
          fi
          echo "RELEASE_NOTES_PATH=${NOTES_FILE}" >> "${GITHUB_ENV}"

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_manifest.py \
            --dist dist \
            --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output dist/update-manifest.json

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
