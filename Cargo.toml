[package]
name = "tiny-shell"
version = "1.5.10"
edition = "2024"
authors = ["tiny-shell contributors"]
description = "A modern, fast, GPUI Component-based desktop terminal client"
license = "GPL-3.0-or-later"
rust-version = "1.85.0"

[features]
# macOS/Linux source builds use FreeRDP when native dependencies can be
# discovered. Windows launches the system mstsc.exe client instead.
# `freerdp` remains the force-on mode for macOS/Linux release builds.
default = ["freerdp-auto"]
freerdp-auto = []
freerdp = []

[dependencies]
anyhow = "1"
tokio-socks = "0.5"
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "fcf32feacb367b75ec84dd40f041e4fd411d3cc1" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
encoding_rs = "0.8"
flate2 = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ca85b5588f5feea021f1ee86cb13703dc6f30ec4" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ca85b5588f5feea021f1ee86cb13703dc6f30ec4" }
menu = { git = "https://github.com/zed-industries/zed" }
portable-pty = "0.8"
rfd = "0.15"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
rust-i18n = "3"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = "0.6"
sysinfo = "0.33"
tar = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25.9", default-features = false, features = ["png"] }
futures = "0.3.32"
notify = "7.0.0"
open = "5.1"
time = { version = "0.3.45", features = ["formatting", "local-offset"] }
tracing-appender = "0.2.5"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[package.metadata.deb]
maintainer = "tiny-shell contributors"
license-file = ["LICENSE"]
extended-description = "A modern, fast, GPUI Component-based desktop terminal client"
section = "terminal"
priority = "optional"
assets = [
    ["target/release/tiny-shell", "usr/bin/", "755"],
    ["assets/tiny-shell.desktop", "usr/share/applications/", "644"],
    ["assets/icons/256x256/tiny-shell.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false


[profile.dev]
# Fast edit → run cycle for the application crate. Dependencies stay at a
# modest optimization level below, so the terminal UI remains responsive.
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1

[build-dependencies]
cc = "1.2.63"
pkg-config = "0.3"
winres = "0.1.12"

[patch.crates-io]
block = { path = "vendor/block-0.1.6" }
proc-macro-error2 = { path = "vendor/proc-macro-error2-2.0.1" }
